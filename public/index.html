<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010102">
<title>JARVIS Agent Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Design reference: Linear (near-black surface ladder, hairlines, one lavender accent used only for activity).
   Layout: top bar, relay strip, then three columns: agents, outputs, document. */
:root{
  --canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a; --hair:#23252a; --hair2:#34343a;
  --ink:#f7f8f8; --ink2:#d0d6e0; --ink3:#8a8f98; --ink4:#62666d;
  --accent:#5e6ad2; --accent-hi:#828fff;
  --ok:#27a644; --warn:#e5a50a; --bad:#eb5757; --idle:#62666d;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --canvas:#ffffff; --s1:#f5f6f6; --s2:#eceef0; --s3:#e4e6e9; --hair:#e1e3e6; --hair2:#c9cdd2;
  --ink:#0b0c0d; --ink2:#3a3f46; --ink3:#626a73; --ink4:#8a919a;
  --accent:#5e6ad2; --accent-hi:#4a55b8; --ok:#1f8a3a; --warn:#a86400; --bad:#c93c3c; --idle:#8a919a; color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation}
a{color:var(--accent-hi)}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:6px;z-index:10;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}

.app{display:grid;grid-template-columns:300px 330px minmax(0,1fr);grid-template-rows:56px auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--hair);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand svg{flex:none}
h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.tally{display:flex;gap:6px;margin-left:8px}
.tally span{display:flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--hair);border-radius:999px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:500}
.tally i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.tally .running i{background:var(--accent-hi)}.tally .done i{background:var(--ok)}.tally .blocked i{background:var(--warn)}.tally .failed i{background:var(--bad)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.live.on i{background:var(--ok)}

.relay{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:10px 20px;border-bottom:1px solid var(--hair);overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none}
.relay::-webkit-scrollbar{display:none}
.relay .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);margin-right:6px;white-space:nowrap}
.relay .sep{color:var(--ink4);flex:none}
.relay .gap{width:1px;height:16px;background:var(--hair2);margin:0 10px;flex:none}
.node{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--hair);border-radius:999px;background:transparent;cursor:pointer;font-size:12px;color:var(--ink3);white-space:nowrap;flex:none}
.node:hover{background:var(--s2);color:var(--ink)}
.node[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}
.node[data-state=running]{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.node[data-state=done] .dot{background:var(--ok)}.node[data-state=blocked] .dot{background:var(--warn)}.node[data-state=failed] .dot{background:var(--bad)}.node[data-state=running] .dot{background:var(--accent-hi)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--idle)}

.col{min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain}
.agents{border-right:1px solid var(--hair);padding:10px 8px}
.outputs{border-right:1px solid var(--hair);padding:12px}
h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);padding:6px 8px}

.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.row:hover{background:var(--s1)}
.row[aria-pressed=true]{background:var(--s2)}
.row .ico{grid-row:1/3;margin-top:2px;color:var(--idle)}
.row[data-state=running] .ico{color:var(--accent-hi)}.row[data-state=done] .ico{color:var(--ok)}.row[data-state=blocked] .ico{color:var(--warn)}.row[data-state=failed] .ico{color:var(--bad)}
.row .nm{font-weight:500;letter-spacing:-.005em}
.row .nm small{color:var(--ink4);font-weight:400;margin-left:8px;font-size:12px}
.row .when{font-size:12px;color:var(--ink4);font-variant-numeric:tabular-nums}
.row .task{grid-column:2/-1;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .step{grid-column:2/-1;color:var(--ink3);font-size:12px;overflow-wrap:anywhere}
.spin{transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.commits{margin-top:14px;border-top:1px solid var(--hair);padding-top:8px}
.commit{display:flex;gap:10px;padding:3px 8px;font-size:12px;color:var(--ink3);min-width:0}
.commit code{font-family:var(--mono);color:var(--accent-hi);flex:none}
.commit span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 10px}
.chip{border:1px solid var(--hair);background:transparent;border-radius:999px;padding:2px 11px;font-size:12px;color:var(--ink3);cursor:pointer}
.chip:hover{color:var(--ink);background:var(--s1)}
.chip[aria-pressed=true]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--s1)}
.item[aria-current=true]{background:var(--s2)}
.item b{display:block;font-weight:500;font-size:13px;overflow-wrap:anywhere}
.item small{display:flex;gap:8px;font-size:12px;color:var(--ink4);margin-top:1px}
.item small em{font-style:normal;color:var(--ink3)}
.note{padding:6px 8px;color:var(--ink3);font-size:12px}
.empty{padding:28px 10px;color:var(--ink3);font-size:13px;text-wrap:balance}

.viewer{padding:0;scroll-margin-top:12px}
.vhead{position:sticky;top:0;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(8px);padding:16px 36px 12px;border-bottom:1px solid var(--hair);z-index:1}
.vhead h2{padding:0;text-transform:none;letter-spacing:-.01em;font-size:15px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.vmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:12px;color:var(--ink3)}
.badge{padding:1px 8px;border-radius:999px;background:var(--s2);color:var(--ink2);font-size:11px}
.copy{margin-left:auto;border:1px solid var(--hair);background:transparent;border-radius:6px;padding:2px 10px;font-size:12px;color:var(--ink3);cursor:pointer}
.copy:hover{color:var(--ink);background:var(--s2)}
.doc{max-width:74ch;padding:26px 36px 80px;font-size:15px;line-height:1.7;color:var(--ink2)}
.doc h1,.doc h2,.doc h3,.doc h4{color:var(--ink);line-height:1.25;letter-spacing:-.02em;margin:1.8em 0 .5em;text-wrap:balance;scroll-margin-top:90px;text-transform:none;padding:0}
.doc h1{font-size:26px;margin-top:0;font-weight:600}.doc h2{font-size:19px;font-weight:600;color:var(--ink);font-size:19px}.doc h3{font-size:16px;font-weight:600}.doc h4{font-size:14px}
.doc p,.doc li{overflow-wrap:anywhere}
.doc strong{color:var(--ink);font-weight:600}
.doc code{font-family:var(--mono);font-size:.86em;background:var(--s2);border:1px solid var(--hair);padding:1px 6px;border-radius:5px;color:var(--ink)}
.doc pre{background:var(--s1);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;overflow:auto}
.doc pre code{background:none;border:0;padding:0}
.doc blockquote{margin:1em 0;padding:2px 16px;border-left:2px solid var(--accent);color:var(--ink3)}
.doc table{border-collapse:collapse;display:block;overflow:auto;font-size:13px}
.doc th,.doc td{border:1px solid var(--hair);padding:6px 12px;text-align:left}
.doc th{background:var(--s1);color:var(--ink);font-weight:500}
.doc hr{border:0;border-top:1px solid var(--hair);margin:2em 0}
.welcome{padding:60px 36px;max-width:56ch}
.welcome h2{font-size:18px;color:var(--ink);text-transform:none;letter-spacing:-.01em;padding:0;margin-bottom:8px}
.welcome p{color:var(--ink3);margin:0}

@media (max-width:1100px){.app{grid-template-columns:250px 260px minmax(0,1fr)}.vhead,.doc,.welcome{padding-inline:22px}}
@media (max-width:760px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .top{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 16px}
  .relay{padding-inline:16px}
  .col{overflow:visible}
  .agents,.outputs{border-right:0;border-bottom:1px solid var(--hair);padding-inline:12px}
  .outputs{display:block}
  .vhead,.doc,.welcome{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#viewer">Skip to document</a>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 translate="no">JARVIS Agent Board</h1>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
    <div class="live" id="live" role="status"><i></i><span>Connecting…</span></div>
  </header>
  <nav class="relay" id="relay" aria-label="Agent relay"></nav>
  <aside class="col agents" id="agents" aria-label="Agents"></aside>
  <section class="col outputs" id="outputs" aria-label="Agent outputs"></section>
  <main class="col viewer" id="viewer" tabindex="-1"><div class="welcome"><h2>Pick something to read</h2><p>Choose an agent to see what it produced, then open a plan, QA note, review or mission to read it here.</p></div></main>
</div>
<script src="app.js"></script>
</body>
</html>
