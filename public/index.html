<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS Agent Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: agent rail on the left, outputs list + document viewer on the right. Dark ops console, state shown by a left stripe and pill. */
:root{
  --bg:#0f161d; --panel:#151f29; --panel2:#1b2733; --line:#2a3744; --fg:#e6ecf1; --muted:#8fa0b0;
  --accent:#6bb3e0;
  --run:#6bb3e0; --done:#58c78a; --block:#e3a64a; --fail:#ff8a80; --idle:#6f7f8e;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f7; --panel:#ffffff; --panel2:#eef2f5; --line:#d9dee4; --fg:#16202a; --muted:#5d6b78;
  --accent:#1f5f8b; --run:#1f5f8b; --done:#1d7a4a; --block:#a86400; --fail:#b3261e; --idle:#6b7785; color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.05rem;font-weight:600}
.tally{display:flex;gap:14px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.tally b{color:var(--fg);font-variant-numeric:tabular-nums}
.live{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);margin-right:6px}
.live.on i{background:var(--done)}
.rail{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);min-height:0}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:6px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover{background:var(--panel2)}
.card:focus-visible,.item:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card.sel{outline:1px solid var(--accent)}
.card[data-state=running]{border-left-color:var(--run)}
.card[data-state=done]{border-left-color:var(--done)}
.card[data-state=blocked]{border-left-color:var(--block)}
.card[data-state=failed]{border-left-color:var(--fail)}
.nm{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.nm small{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px;font-size:.78rem}
.pill{font-family:var(--mono);font-size:.7rem;padding:1px 9px;border-radius:999px;background:var(--panel2);color:var(--idle);align-self:start}
[data-state=running] .pill{color:var(--run);background:color-mix(in srgb,var(--run) 16%,transparent)}
[data-state=done] .pill{color:var(--done);background:color-mix(in srgb,var(--done) 16%,transparent)}
[data-state=blocked] .pill{color:var(--block);background:color-mix(in srgb,var(--block) 16%,transparent)}
[data-state=failed] .pill{color:var(--fail);background:color-mix(in srgb,var(--fail) 16%,transparent)}
.card p{grid-column:1/-1;margin:0;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.card p.task{color:var(--fg)}
.card .meta{font-family:var(--mono);font-size:.7rem}
.main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.list{overflow:auto;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:.75rem;cursor:pointer}
.chip.on{color:var(--fg);border-color:var(--accent)}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:7px 9px;border-radius:5px;cursor:pointer}
.item:hover{background:var(--panel)}
.item.sel{background:var(--panel);border-color:var(--line)}
.item b{display:block;font-weight:500;font-size:.85rem;overflow-wrap:anywhere}
.item span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.sec{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px}
.viewer{overflow:auto;padding:22px 28px;min-width:0;min-height:0}
.viewer .path{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:12px;overflow-wrap:anywhere}
.doc{max-width:78ch}
.doc h1,.doc h2,.doc h3,.doc h4{line-height:1.25;margin:1.4em 0 .5em;text-wrap:balance}
.doc h1{font-size:1.4rem;margin-top:0}.doc h2{font-size:1.15rem}.doc h3{font-size:1rem}
.doc p,.doc li{overflow-wrap:anywhere}
.doc code{font-family:var(--mono);font-size:.85em;background:var(--panel2);padding:1px 5px;border-radius:4px}
.doc pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto}
.doc pre code{background:none;padding:0}
.doc blockquote{margin:1em 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.doc table{border-collapse:collapse;display:block;overflow:auto}
.doc th,.doc td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.doc a{color:var(--accent)}
.doc hr{border:0;border-top:1px solid var(--line)}
.empty{color:var(--muted);padding:30px 0}
.commits{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.commits div{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:2px 4px;overflow-wrap:anywhere}
.commits b{color:var(--accent);font-weight:500}
@media (max-width:980px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .main{grid-template-columns:1fr}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:320px}
  .viewer{padding:18px 16px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>JARVIS Agent Board</h1>
    <div class="tally" id="tally"></div>
    <div class="live" id="live"><i></i><span>connecting</span></div>
  </header>
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <nav class="list" id="list" aria-label="Agent outputs"></nav>
    <section class="viewer" id="viewer"><div class="empty">Pick an agent or an output on the left to read it here.</div></section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
